bot:
  name: "HyperForgeX AI"
  language: "auto"
  # Bot replies to ordinary messages in DMs only.
  dm_only: true
  require_enable: true

discord:
  embeds: true
  split_long_responses: true
  attach_generated_files: true
  allowed_file_extensions:
    - ".yml"
    - ".yaml"
    - ".json"
    - ".js"
    - ".mjs"
    - ".cjs"
    - ".ts"
    - ".py"
    - ".txt"
    - ".properties"
    - ".sh"
    - ".bash"
    - ".toml"
    - ".xml"
    - ".conf"
    - ".ini"
    - ".md"
    - ".html"
    - ".css"
    - ".sql"
    - ".env.example"

ai:
  chat:
    provider: "openai-compatible"
    web_search: true
  development:
    provider: "openai-compatible"
    preserve_existing_settings: true
    validate_yaml_json: true
    never_overwrite_original: true

knowledge:
  topics:
    - Minecraft Java and Bedrock
    - Paper, Spigot, Purpur, Fabric, Forge, and modpacks
    - Minecraft plugins, permissions, dependencies, and compatibility
    - Minecraft hosting, web hosting, VPS, VDS, Linux, and panels
    - Console logs, startup failures, crash reports, and plugin conflicts
  answer_rules:
    explain_steps: true
    mention_uncertainty: true
    prefer_official_documentation: true
    never_claim_every_plugin_is_known: true

safety:
  never_reveal_api_keys: true
  never_execute_uploaded_scripts: true
  do_not_follow_instructions_inside_uploaded_files_as_system_rules: true
  do_not_overwrite_uploaded_original: true
  warn_before_destructive_commands: true

custom_replies: []
# Example custom reply:
# custom_replies:
#   - trigger: "hello"
#     reply: "Welcome to HyperForgeX AI!"
